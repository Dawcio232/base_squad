<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Password</title>
    <link rel="stylesheet" href="./hub.css" />
</head>
<body>
    <div class="grid"></div>

    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark"><span>D</span></div>
                <div class="brand-copy">
                    <h1>DAWCIO POWER SQUAD</h1>
                    <p>Password Recovery</p>
                </div>
            </div>
        </header>

        <main class="main" style="grid-template-columns:1fr;">
            <section class="panel section" style="max-width:720px;margin:0 auto;width:100%;">
                <div class="section-head">
                    <h3>Set New Password</h3>
                    <span>Recovery Session</span>
                </div>
                <div class="auth-card">
                    <p>Enter a new password for this account.</p>
                    <div class="field-grid">
                        <input id="newPasswordInput" type="password" placeholder="new password" autocomplete="off" />
                        <input id="confirmPasswordInput" type="password" placeholder="confirm new password" autocomplete="off" />
                    </div>
                    <div class="actions">
                        <button class="button" id="savePasswordButton" type="button">Update Password</button>
                        <a class="button secondary" href="./hub.html">Back To Hub</a>
                    </div>
                    <div class="message" id="passwordMessage"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="./app-config.js"></script>
    <script type="module" src="./update-password.js"></script>
</body>
</html>
