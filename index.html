<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D Loading Interface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #020202;
            --fg: rgba(255, 255, 255, 0.96);
            --line: rgba(255, 255, 255, 0.86);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-strong: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow: 0 0 40px rgba(255, 255, 255, 0.08);
            --green: #9cffbd;
            --red: #ff8d8d;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.06), transparent 18%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03), transparent 42%),
                var(--bg);
            color: var(--fg);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .shell {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .center-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
        }

        .logo-stack {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: auto;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, filter 0.35s ease;
        }

        .logo-stack.ready {
            cursor: pointer;
        }

        .logo-stack.ready:hover {
            filter: drop-shadow(0 0 26px rgba(255, 255, 255, 0.16));
        }

        .logo-stack.shift-up {
            transform: translate(-50%, calc(-50% - 34px));
        }

        .logo-stack.password-mode {
            transform: translate(-50%, calc(-50% - 58px));
        }

        .logo-stack.success {
            transform: translate(-50%, calc(-50% - 58px)) scale(1.04);
        }

        .logo-stack.vanish {
            animation: logoExit 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo {
            position: relative;
            width: 130px;
            height: 130px;
            display: grid;
            place-items: center;
            animation: logoBreath 5s ease-in-out infinite;
        }

        .logo-letter {
            position: relative;
            z-index: 3;
            width: 100%;
            font-size: 94px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 24px rgba(255, 255, 255, 0.38);
            transition: opacity 0.4s ease, transform 0.4s ease;
            animation: drift 3.4s ease-in-out infinite alternate;
        }

        .logo-stack.loading .logo-letter {
            animation: none;
        }

        .logo-stack.dimmed .logo-letter {
            opacity: 0.58;
            transform: scale(0.97);
        }

        .hint {
            position: absolute;
            top: calc(50% + 108px);
            left: 50%;
            transform: translateX(-50%);
            min-height: 14px;
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            opacity: 0.72;
            white-space: nowrap;
            z-index: 5;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hint.hidden {
            opacity: 0;
        }

        .loader-core {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .loader-core.visible {
            opacity: 1;
        }

        .loader-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.8);
            transform: scale(0);
            transition: transform 0.35s ease, opacity 0.35s ease;
            opacity: 0;
        }

        .loader-dot.visible {
            transform: scale(1);
            opacity: 1;
        }

        .loader-dot.pulse {
            animation: dotPulse 0.8s ease-in-out infinite alternate;
        }

        .loader-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.82);
            transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
        }

        .loader-ring::before,
        .loader-ring::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin: -5px 0 0 -5px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.8);
        }

        .loader-ring.spinning {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: ringSpin 2.2s linear infinite, ringBreath 2.8s ease-in-out infinite;
        }

        .loader-ring.spinning::before {
            transform: translateX(55px);
        }

        .loader-ring.spinning::after {
            opacity: 0;
        }

        .loader-ring.dual::after {
            opacity: 1;
            transform: translateX(-55px);
        }

        .loader-ring.glow {
            box-shadow: 0 0 34px rgba(255, 255, 255, 0.12), inset 0 0 24px rgba(255, 255, 255, 0.08);
        }

        .loader-ring.booting {
            opacity: 1;
            transform: translate(-50%, -50%) scale(0.72);
            animation: loaderBoot 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .full-line {
            position: absolute;
            top: calc(50% + 42px);
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--line) 12%, #fff 50%, var(--line) 88%, transparent 100%);
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.24);
            transform: translate(-50%, 0);
            transform-origin: center;
            overflow: hidden;
            transition: width 0.85s cubic-bezier(0.2, 0.85, 0.25, 1), opacity 0.4s ease, top 0.6s ease, box-shadow 0.4s ease;
            z-index: 2;
        }

        .full-line::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
            transform: translateX(-130%);
            opacity: 0;
        }

        .full-line.active {
            width: 100vw;
            box-shadow: 0 0 28px rgba(255, 255, 255, 0.28);
        }

        .full-line.active::after {
            opacity: 1;
            animation: lineSweep 1.8s ease-out 1;
        }

        .full-line.collapse {
            width: 12px;
            border-radius: 999px;
        }

        .full-line.password-line {
            top: calc(50% - 132px);
            width: min(420px, 84vw);
            border-radius: 999px;
        }

        .full-line.auth-line {
            top: calc(50% - 18px);
            width: min(520px, 88vw);
            border-radius: 999px;
            box-shadow: 0 0 34px rgba(255, 255, 255, 0.34);
        }

        .inputs-row {
            position: absolute;
            top: calc(50% + 88px);
            left: 50%;
            width: min(1120px, 96vw);
            transform: translate(-50%, 0);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
            z-index: 4;
        }

        .inputs-row.visible {
            opacity: 1;
            pointer-events: auto;
            animation: inputsRise 0.6s ease-out both;
        }

        .input-group {
            display: flex;
            gap: 16px;
            width: calc(50% - 120px);
            justify-content: flex-end;
        }

        .input-group.right {
            justify-content: flex-start;
        }

        .code-box {
            width: min(180px, 18vw);
            min-width: 130px;
            padding: 14px 18px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), var(--shadow);
            color: #fff;
            text-align: center;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, opacity 0.4s ease, background 0.25s ease;
        }

        .code-box::placeholder,
        .password-input::placeholder {
            color: rgba(255, 255, 255, 0.42);
        }

        .code-box:focus,
        .password-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.18), 0 0 32px rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .code-box.ok {
            border-color: rgba(156, 255, 189, 0.92);
            box-shadow: 0 0 18px rgba(156, 255, 189, 0.22), inset 0 0 18px rgba(156, 255, 189, 0.12);
            color: #fff;
        }

        .code-box.error,
        .password-input.error {
            border-color: rgba(255, 141, 141, 0.9);
            box-shadow: 0 0 20px rgba(255, 141, 141, 0.18);
        }

        .inputs-row.collapse .code-box {
            opacity: 0;
            transform: scale(0.7) translateY(8px);
            pointer-events: none;
        }

        .logs {
            position: absolute;
            top: calc(50% + 178px);
            left: 50%;
            transform: translateX(-50%);
            width: min(700px, 88vw);
            min-height: 84px;
            padding: 24px 28px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.11), transparent 34%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.045));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 18px 70px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08), var(--shadow);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s ease;
            z-index: 4;
            overflow: hidden;
        }

        .logs::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
            transform: translateX(-120%);
            animation: panelSweep 4.6s linear infinite;
            pointer-events: none;
        }

        .logs.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .logs.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(12px);
        }

        .pre-password {
            position: absolute;
            top: calc(50% + 164px);
            left: 50%;
            transform: translateX(-50%);
            width: min(560px, 88vw);
            display: flex;
            justify-content: center;
            gap: 14px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
            z-index: 5;
            pointer-events: none;
        }

        .pre-password.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .pre-pill {
            width: 78px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .pre-pill::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.94), transparent);
            transform: translateX(-130%);
            animation: pillRun 0.85s ease-in-out infinite;
        }

        .log-label {
            margin-bottom: 10px;
            font-size: 10px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            opacity: 0.58;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-label::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.55);
            animation: statusBlink 1.5s ease-in-out infinite;
        }

        .log-text {
            min-height: 22px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.92;
            transition: opacity 0.35s ease, transform 0.35s ease;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
        }

        .log-text.flash {
            animation: pulseText 0.7s ease;
        }

        .password-shell {
            position: absolute;
            top: calc(50% + 238px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            width: min(440px, 86vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s ease;
            z-index: 6;
            pointer-events: none;
        }

        .password-shell.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
            animation: passwordReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .password-input {
            width: 100%;
            padding: 15px 18px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), var(--shadow);
            color: #fff;
            text-align: center;
            font-size: 15px;
            outline: none;
            pointer-events: auto;
        }

        .password-note {
            font-size: 10px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .security-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(520px, 88vw);
            padding: 22px 24px 20px;
            border-radius: 26px;
            border: 1px solid rgba(255, 141, 141, 0.32);
            background:
                radial-gradient(circle at top left, rgba(255, 141, 141, 0.16), transparent 32%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.08), 0 0 34px rgba(255, 141, 141, 0.08);
            transform: translate(-50%, -50%) scale(0.94);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 7;
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
            overflow: hidden;
        }

        .security-modal::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.08) 48%, transparent 100%);
            transform: translateX(-130%);
            animation: alertSweep 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        .security-modal::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 141, 141, 0.2);
            animation: alertPulse 1.6s ease-in-out infinite;
            pointer-events: none;
        }

        .security-modal.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            animation: modalIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .security-badge {
            margin-bottom: 14px;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 171, 171, 0.9);
            animation: warningBlink 1.2s ease-in-out infinite;
        }

        .security-title {
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.06em;
            position: relative;
            z-index: 1;
        }

        .security-copy {
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.76);
            position: relative;
            z-index: 1;
        }

        .security-input {
            width: 100%;
            padding: 15px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .security-input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 0 26px rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .security-input.error {
            border-color: rgba(255, 141, 141, 0.9);
            box-shadow: 0 0 22px rgba(255, 141, 141, 0.14);
        }

        .security-note {
            margin-top: 12px;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.54;
            position: relative;
            z-index: 1;
        }

        @keyframes drift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-5px);
            }
        }

        @keyframes logoBreath {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes ringSpin {
            from {
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg) scale(1);
            }
        }

        @keyframes ringBreath {
            0% {
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.05), inset 0 0 10px rgba(255, 255, 255, 0.02);
            }

            50% {
                box-shadow: 0 0 32px rgba(255, 255, 255, 0.16), inset 0 0 20px rgba(255, 255, 255, 0.08);
            }

            100% {
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.05), inset 0 0 10px rgba(255, 255, 255, 0.02);
            }
        }

        @keyframes loaderBoot {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.28);
                filter: blur(10px);
            }

            55% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                filter: blur(0);
            }
        }

        @keyframes pulseText {
            0% {
                opacity: 0.1;
                transform: translateY(6px);
            }

            100% {
                opacity: 0.92;
                transform: translateY(0);
            }
        }

        @keyframes lineSweep {
            0% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        @keyframes inputsRise {
            0% {
                opacity: 0;
                filter: blur(8px);
                transform: translate(-50%, 16px) scale(0.96);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: translate(-50%, 0) scale(1);
            }
        }

        @keyframes dotPulse {
            from {
                box-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
            }

            to {
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.95);
            }
        }

        @keyframes passwordReveal {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.94);
            }

            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: translate(-50%, calc(-50% + 18px)) scale(0.94);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes panelSweep {
            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(120%);
            }
        }

        @keyframes statusBlink {
            0% {
                opacity: 0.45;
                transform: scale(0.85);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0.45;
                transform: scale(0.85);
            }
        }

        @keyframes alertSweep {
            0% {
                transform: translateX(-130%);
            }

            60% {
                transform: translateX(130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        @keyframes alertPulse {
            0% {
                opacity: 0.35;
                transform: scale(1);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.01);
            }

            100% {
                opacity: 0.35;
                transform: scale(1);
            }
        }

        @keyframes warningBlink {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        @keyframes pillRun {
            0% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        @keyframes logoExit {
            0% {
                opacity: 1;
                filter: blur(0);
                transform: translate(-50%, calc(-50% - 58px)) scale(1.04);
            }

            35% {
                opacity: 1;
                filter: blur(0);
                transform: translate(-50%, calc(-50% - 58px)) scale(1.12);
            }

            100% {
                opacity: 0;
                filter: blur(18px);
                transform: translate(-50%, calc(-50% - 58px)) scale(0.4);
            }
        }

        @media (max-width: 980px) {
            .inputs-row {
                width: min(760px, 94vw);
                gap: 16px;
            }

            .input-group {
                width: calc(50% - 90px);
                gap: 10px;
            }

            .code-box {
                min-width: 100px;
                width: min(130px, 22vw);
            }
        }

        @media (max-width: 760px) {
            .inputs-row {
                flex-direction: column;
                top: calc(50% + 108px);
                gap: 14px;
            }

            .input-group,
            .input-group.right {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .logo-stack.shift-up,
            .logo-stack.password-mode,
            .logo-stack.success {
                transform: translate(-50%, calc(-50% - 54px));
            }

            .full-line.password-line {
                top: calc(50% - 148px);
            }

            .password-shell {
                top: calc(50% + 252px);
            }

            .full-line.auth-line {
                top: calc(50% + 6px);
            }

            .pre-password {
                top: calc(50% + 182px);
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="center-stage">
            <div class="full-line" id="mainLine"></div>

            <div class="inputs-row" id="inputsRow">
                <div class="input-group">
                    <input class="code-box" type="text" placeholder="channel_01" maxlength="4" />
                    <input class="code-box" type="text" placeholder="channel_02" maxlength="4" />
                </div>
                <div class="input-group right">
                    <input class="code-box" type="text" placeholder="channel_03" maxlength="4" />
                    <input class="code-box" type="text" placeholder="channel_04" maxlength="4" />
                </div>
            </div>

            <div class="logo-stack ready" id="logoStack">
                <div class="logo">
                    <div class="loader-core" id="loaderCore">
                        <div class="loader-dot" id="loaderDot"></div>
                        <div class="loader-ring" id="loaderRing"></div>
                    </div>
                    <div class="logo-letter">D</div>
                </div>
            </div>

            <div class="hint" id="hintText">Click To Initialize</div>

            <div class="logs" id="logsPanel">
                <div class="log-label">system activity</div>
                <div class="log-text" id="logText"></div>
            </div>

            <div class="pre-password" id="prePassword">
                <div class="pre-pill"></div>
                <div class="pre-pill"></div>
                <div class="pre-pill"></div>
            </div>

            <div class="password-shell" id="passwordShell">
                <input
                    class="password-input"
                    id="passwordInput"
                    type="password"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="enter password"
                />
                <div class="password-note">passphrase required</div>
            </div>

            <div class="security-modal" id="securityModal">
                <div class="security-badge">connection warning</div>
                <div class="security-title">More Authentication Required</div>
                <div class="security-copy">
                    Unsecure connection detected on the outbound tunnel. Re-enter the passphrase to continue the handshake.
                </div>
                <input
                    class="security-input"
                    id="securityInput"
                    type="password"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="enter secondary phrase"
                />
                <div class="security-note">secondary verification gate</div>
            </div>
        </div>
    </div>

    <script>
        const ACCESS_CODES = ["9*45", "9*43", "9*45", "9*47"];
        const PASSWORD = "elementary";
        const SECONDARY_PASSWORD = "fractal";
        const REDIRECT_URL = "https://dawcio232.github.io/base_squad/hub.html";
        const LOG_DURATION = 5000;
        const LOGS = [
            "Firebase connection accessing",
            "Realtime database bridge syncing",
            "Cloud function tunnel warming",
            "Encrypted cache surface rebuilding",
            "Identity mesh verifying node trust",
            "Vault relay stitching shadow routes",
            "Signal transport sealing packet edges",
            "Access graph normalizing permissions",
            "Liquid glass renderer stabilizing",
            "Primary gateway prepared"
        ];

        const logoStack = document.getElementById("logoStack");
        const hintText = document.getElementById("hintText");
        const mainLine = document.getElementById("mainLine");
        const inputsRow = document.getElementById("inputsRow");
        const codeBoxes = Array.from(document.querySelectorAll(".code-box"));
        const loaderCore = document.getElementById("loaderCore");
        const loaderDot = document.getElementById("loaderDot");
        const loaderRing = document.getElementById("loaderRing");
        const logsPanel = document.getElementById("logsPanel");
        const logText = document.getElementById("logText");
        const prePassword = document.getElementById("prePassword");
        const passwordShell = document.getElementById("passwordShell");
        const passwordInput = document.getElementById("passwordInput");
        const securityModal = document.getElementById("securityModal");
        const securityInput = document.getElementById("securityInput");

        let stage = "idle";
        let logIndex = 0;

        logoStack.addEventListener("click", () => {
            if (stage !== "idle") {
                return;
            }

            stage = "code";
            logoStack.classList.remove("ready");
            logoStack.classList.add("shift-up");
            hintText.textContent = "Authorization Sequence";
            mainLine.classList.add("active");

            setTimeout(() => {
                inputsRow.classList.add("visible");
                codeBoxes[0].focus();
            }, 260);
        });

        codeBoxes.forEach((box, index) => {
            box.addEventListener("input", () => {
                box.classList.remove("error");
                box.classList.remove("ok");

                if (box.value.length >= ACCESS_CODES[index].length && index < codeBoxes.length - 1) {
                    codeBoxes[index + 1].focus();
                }

                validateCode();
            });

            box.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    validateCode();
                }
            });
        });

        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                validatePassword();
            }
        });

        securityInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                validateSecurityPass();
            }
        });

        function validateCode() {
            if (stage !== "code") {
                return;
            }

            const values = codeBoxes.map((box) => box.value.trim());
            if (values.some((value) => value.length === 0)) {
                return;
            }

            const isValid = values.every((value, index) => value === ACCESS_CODES[index]);
            codeBoxes.forEach((box, index) => {
                box.classList.toggle("ok", values[index] === ACCESS_CODES[index]);
                box.classList.toggle("error", values[index] !== ACCESS_CODES[index]);
            });

            if (!isValid) {
                hintText.textContent = "Invalid Sequence";
                return;
            }

            hintText.textContent = "Sequence Accepted";
            stage = "collapsing";

            setTimeout(() => {
                inputsRow.classList.add("collapse");
                hintText.classList.add("hidden");
                logoStack.classList.add("dimmed");
                mainLine.classList.add("collapse");
                loaderCore.classList.add("visible");
                loaderDot.classList.add("visible", "pulse");
            }, 320);

            setTimeout(() => {
                inputsRow.classList.remove("visible");
                playLoaderIntro();
            }, 900);
        }

        function playLoaderIntro() {
            stage = "pre-loading";
            hintText.textContent = "Compressing Sequence";
            loaderDot.classList.remove("pulse");
            loaderDot.classList.remove("visible");
            loaderRing.classList.add("booting", "glow");

            setTimeout(() => {
                loaderRing.classList.remove("booting");
                startLoading();
            }, 980);
        }

        function startLoading() {
            stage = "loading";
            logoStack.classList.add("loading");
            loaderRing.classList.add("spinning", "glow");
            hintText.textContent = "Decrypting Layers";
            hintText.classList.remove("hidden");
            logsPanel.classList.add("visible");
            showNextLog();
        }

        function showNextLog() {
            logText.textContent = LOGS[logIndex];
            logText.classList.remove("flash");
            void logText.offsetWidth;
            logText.classList.add("flash");

            if (logIndex === LOGS.length - 1) {
                setTimeout(finishLoading, LOG_DURATION);
                return;
            }

            logIndex += 1;
            setTimeout(showNextLog, LOG_DURATION);
        }

        function finishLoading() {
            stage = "pre-password";
            loaderRing.classList.add("dual");
            hintText.textContent = "Preparing Passphrase Gate";
            hintText.classList.remove("hidden");
            logsPanel.classList.remove("visible");
            logsPanel.classList.add("hidden");
            logoStack.classList.remove("shift-up");
            logoStack.classList.add("password-mode");
            mainLine.classList.remove("active", "collapse");

            setTimeout(() => {
                prePassword.classList.add("visible");
            }, 180);

            setTimeout(() => {
                prePassword.classList.remove("visible");
                mainLine.classList.add("password-line");
                passwordShell.classList.add("visible");
                hintText.textContent = "Password Required";
                stage = "password";
                setTimeout(() => passwordInput.focus(), 180);
            }, 1550);
        }

        function validatePassword() {
            if (stage !== "password") {
                return;
            }

            const value = passwordInput.value.trim();
            passwordInput.classList.remove("error");

            if (value !== PASSWORD) {
                passwordInput.classList.add("error");
                return;
            }

            stage = "secondary-auth";
            hintText.textContent = "Unsecure Connection";
            logoStack.classList.add("success");
            passwordShell.classList.remove("visible");
            mainLine.classList.remove("password-line");
            mainLine.classList.add("active", "auth-line");

            setTimeout(() => {
                securityModal.classList.add("visible");
                securityInput.focus();
            }, 260);
        }

        function validateSecurityPass() {
            if (stage !== "secondary-auth") {
                return;
            }

            const value = securityInput.value.trim();
            securityInput.classList.remove("error");

            if (value !== SECONDARY_PASSWORD) {
                securityInput.classList.add("error");
                return;
            }

            stage = "success";
            hintText.textContent = "Access Granted";
            securityModal.classList.remove("visible");
            logoStack.classList.add("vanish");
            mainLine.classList.remove("auth-line");
            mainLine.classList.add("collapse");
            loaderRing.classList.remove("spinning");
            loaderRing.classList.add("glow");

            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 1200);
        }
    </script>
</body>
</html>
